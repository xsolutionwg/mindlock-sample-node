name: check
on: [push, pull_request]
jobs:
  run-like-mindlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t app .
      - name: Run like a Mindlock server (MongoDB, read-only, non-root, no capabilities)
        run: |
          set -e
          mkdir -p s && openssl rand -hex 16 > s/db_password && openssl rand -hex 16 > s/root_password && chmod 444 s/*
          echo "const fs=require('fs');db.getSiblingDB('app').createUser({user:'app',pwd:fs.readFileSync('/run/secrets/db_password','utf8').trim(),roles:[{role:'readWrite',db:'app'}]});" > init.js
          docker network create private
          docker run -d --name database --network private -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/root_password -e MONGO_INITDB_DATABASE=app -v $PWD/s:/run/secrets:ro -v $PWD/init.js:/docker-entrypoint-initdb.d/app.js:ro mongo:8.0
          for i in $(seq 40); do docker exec database mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 3; done
          sleep 5
          docker run -d --name app --network private -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges:true --memory 512m -e PORT=8080 -e MONGODB_HOST=database -e MONGODB_DATABASE=app -e MONGODB_USER=app -e MONGODB_PASSWORD_FILE=/run/secrets/db_password -v $PWD/s/db_password:/run/secrets/db_password:ro app
          for i in $(seq 30); do curl -fs localhost:8080/health && break; sleep 2; done
          test -n "$(docker inspect -f '{{.Config.User}}' app)" || { echo "image must run as non-root"; exit 1; }
          curl -fs -X POST -d 'text=hello from CI' localhost:8080/notes -o /dev/null
          curl -fs localhost:8080/ | grep -q 'hello from CI'
          curl -fs localhost:8080/api/notes | grep -q 'hello from CI'
      - if: failure()
        run: docker logs app || true
